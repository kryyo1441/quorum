name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: uw, POSTGRES_PASSWORD: uw, POSTGRES_DB: uw }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U uw" --health-interval 2s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://uw:uw@localhost:5432/uw   # enables the real-Postgres tests (log store, witness state)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager" (setting both is an error)
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uw/shared build && pnpm --filter @uw/log-core build && pnpm --filter @uw/witness-core build && pnpm --filter @uw/client-sdk build
      - run: pnpm --filter @uw/log-server db:generate
      - run: pnpm -r --if-present test          # unit tests, fixtures and the 10 adversarial scenarios (demo/src/scenarios.test.ts)
      - run: pnpm --filter @uw/web exec tsc --noEmit
